name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -cover ./...

      - name: Verify compilation on all targets
        run: |
          targets=(
            "linux/amd64" "linux/arm64"
            "windows/amd64" "windows/arm64"
            "darwin/amd64" "darwin/arm64"
            "freebsd/amd64" "freebsd/arm64"
          )
          for target in "${targets[@]}"; do
            IFS="/" read -r os arch <<< "$target"
            echo "Testing build for $os/$arch..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/securecrt-decoder
          done
